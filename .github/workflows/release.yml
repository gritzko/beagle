name: Release

on:
  push:
    tags: [ "[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+" ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to test and build the tarball for"
        required: true

permissions:
  contents: write

# The release attaches the source tarball of the JS dispatch tree (main.js +
# core/ + verbs/ + views/ + shared/) plus `be` binaries — jab built with this
# rev packed in as the default jsrc floor (JAB-035), a single executable that
# works with no checkout.  The `release` job runs the suite and gates the
# `binaries` matrix (same targets and toolchain as jab's own release).
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # No passwordless ssh-to-localhost on the runner — skip the ssh:// wire
      # cases deterministically (see test/wire/lib/wirecase.sh).
      BE_TEST_NO_SSH: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # Test cases live in the beagle-ext-tests submodule; its .gitmodules URL is
      # SSH — rewrite to HTTPS so the runner can clone it.
      - name: Fetch test fixtures (beagle-ext-tests submodule)
        run: |
          # --global so the rewrite is inherited by the `git submodule` clone
          # subprocess (a local-config rewrite is not); beagle-ext-tests is
          # public, so HTTPS needs no auth.
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive

      - name: Install jab runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get -y install \
            libjavascriptcoregtk-4.1-0 libsodium23 liblz4-1 zlib1g libcurl3-gnutls

      - name: Download latest jab
        run: |
          gh release download --repo gritzko/jab --pattern 'jab-linux-x86_64-*.tar.gz'
          tar xzf jab-linux-x86_64-*.tar.gz
          sudo install -m 0755 jab-linux-x86_64-*/jab /usr/local/bin/jab
          # `be` is jab under another name (jab dispatches on argv[0]); the suite
          # invokes $BIN/be, so ship the symlink beside it.
          sudo ln -sf jab /usr/local/bin/be
          rm -rf jab-linux-x86_64-*
          jab --version || true

      - name: Configure
        run: cmake -S . -B build -DBEAGLE_BIN_DIR=/usr/local/bin

      - name: Test
        working-directory: build
        run: ctest --output-on-failure

      - name: Pack tarball
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          NAME="beagle-${TAG}"
          git archive --format=tar.gz --prefix="${NAME}/" -o "${NAME}.tar.gz" HEAD
          shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            beagle-*.tar.gz
            beagle-*.tar.gz.sha256

  # JAB-035: build jab from source with this rev packed in as the default jsrc
  # floor and ship it named `be`.  Targets and toolchain mirror jab's own
  # release matrix (ninja; clang on linux).  The pack source is a pristine
  # `git archive` of the release rev — no .git, no fetched test fixtures.  On
  # macOS ld ad-hoc-signs the binary and the .incbin pack sits inside the
  # Mach-O, so the signature covers it — curl/tar installs just run.
  binaries:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: be-linux-x86_64
          - os: ubuntu-24.04-arm
            asset: be-linux-arm64
          - os: macos-latest
            asset: be-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get -y install ninja-build clang \
            libjavascriptcoregtk-4.1-dev \
            libsodium-dev libcurl4-gnutls-dev liblz4-dev zlib1g-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja libsodium lz4

      - name: Build be (jab + packed jsrc)
        run: |
          git clone --recurse-submodules --depth 1 \
            https://github.com/gritzko/jab.git jab-src
          mkdir be-jsrc && git archive HEAD | tar -x -C be-jsrc
          cmake -S jab-src -B jab-src/build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            ${{ runner.os == 'Linux' && '-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++' || '' }} \
            -DJAB_JSRC="$PWD/be-jsrc"
          ninja -C jab-src/build
          install -m 0755 jab-src/build/bin/jab be-bin

      # A fresh HOME has no jsrc anywhere, so a bareword invocation must
      # extract the embedded floor to .cache/jsrcs/<hash>/ and load main.js
      # from it.  An unpacked binary (jab without JAB-035) fails right here.
      - name: Smoke test the packed be
        run: |
          S=$(mktemp -d); W=$(mktemp -d)
          (cd "$W" && HOME="$S" XDG_CACHE_HOME= \
            "$GITHUB_WORKSPACE/be-bin" status 2>&1 | head -5) || true
          find "$S/.cache/jsrcs" -mindepth 1 -maxdepth 1 -type d | grep -q .

      - name: Pack
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          NAME="${{ matrix.asset }}-${TAG}"
          install -d "dist/${NAME}"
          install -m 0755 be-bin "dist/${NAME}/be"
          tar -C dist -czf "${NAME}.tar.gz" "${NAME}"
          shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            ${{ matrix.asset }}-*.tar.gz
            ${{ matrix.asset }}-*.tar.gz.sha256

  # JAB-035: the fully static linux x86_64 `be` — musl + static JSCOnly +
  # embedded slim ICU data + embedded pack.  Runs on ANY Linux (glibc or
  # musl), zero runtime deps.  The WebKit compile is cached across releases;
  # a cold run takes ~40 min.  Linux only — no static mac build.
  static:
    needs: release
    runs-on: ubuntu-latest
    container: alpine:3.22
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Container prerequisites for checkout
        run: apk add -q git tar

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      # actions/checkout writes its safe.directory exception into a temporary
      # HOME the container shell never sees; we run as container root, so any
      # git command against the runner-owned checkout (git archive in
      # static-be.sh) dies with "dubious ownership".  Fixed here as well as in
      # static-be.sh so that dispatching a pre-fix tag still builds.
      - name: Mark checkout safe for container git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # Only the linked archives + API headers are needed on a warm run
      # (static-be.sh skips the whole WebKit compile when they are present);
      # ~93 MB vs the 288 MB build tree, far under the 10 GB repo cache cap.
      # restore/save split instead of actions/cache: the combined action skips
      # its save when the job fails, which cost a full 40-min JSC recompile on
      # every red run — save unconditionally once the archives exist.
      - uses: actions/cache/restore@v4
        with:
          path: |
            jsc-build/lib
            jsc-build/JavaScriptCore/Headers
          key: jsc-static-2.52.5-alpine3.22

      - name: Build static be
        run: sh .github/static-be.sh "$PWD/jsc-build" "$PWD/be-bin"

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            jsc-build/lib
            jsc-build/JavaScriptCore/Headers
          key: jsc-static-2.52.5-alpine3.22

      - name: Pack and upload
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          NAME="be-linux-x86_64-static-${TAG}"
          install -d "dist/${NAME}"
          install -m 0755 be-bin "dist/${NAME}/be"
          tar -C dist -czf "${NAME}.tar.gz" "${NAME}"
          sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            be-linux-x86_64-static-*.tar.gz
            be-linux-x86_64-static-*.tar.gz.sha256
